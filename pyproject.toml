[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uxbench-uxagent"
version = "0.1.0"
description = "A lightweight UX feedback agent for local UXBench websites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "click>=8.1.0",
  "openai>=1.86.0",
  "playwright>=1.48.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.0",
]

[project.scripts]
uxagent = "uxagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["uxagent"]

[tool.ruff]
line-length = 100
