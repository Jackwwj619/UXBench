default_provider: openai

providers:
  openai:
    api_key: xxx
    base_url: xxx
    model: gpt-5.4-mini
    models:
      gpt-5.4: gpt-5.4
      mini: gpt-5.4-mini
      nano: gpt-5.4-nano
      gemini-2.5-pro: gemini-2.5-pro
      gemini-3.1-pro: gemini-3.1-pro
      claude-4.6-sonnet: claude-4.6-sonnet
      gemini-3.1-pro-preview: gemini-3.1-pro-preview
      glm-5.1: glm-5.1
      kimi-k2.5: kimi-k2.5
      qwen-3.6-plus: qwen-3.6-plus
    default_headers: {}
    default_query: {}

  custom-compatible:
    api_key: xxx
    base_url: https://your-provider.example/v1
    model: your-model
    default_headers: {}
    default_query: {}

audit:
  provider: openai
  model: gpt-5.4-mini
  start: index.html
  max_steps: 80
  exploration_depth: exhaustive
  headed: false
  viewport: both
  protect_risky_actions: true
  out: runs

audit_url:
  provider: openai
  model: gpt-5.4-mini
  max_steps: 80
  exploration_depth: exhaustive
  headed: false
  viewport: both
  protect_risky_actions: true
  out: runs

eval:
  provider: openai
  model: gpt-5.4-mini
  start: index.html
  max_steps: 80
  exploration_depth: exhaustive
  headed: false
  viewport: both
  protect_risky_actions: true
