<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your seat — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small">
  <a class="brand" href="index.html"><span>OrbitRide</span></a>
  <span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span> · price locked</span>
</header>
<main class="bus-page">
  <section class="bus-wrap">
    <div id="tripContext" class="trip-context"></div>
    <h1>Pick your <span id="needSeats">2</span> seats</h1>
    <p class="hint">Window seats marked <strong>W</strong>, aisle <strong>A</strong>, priority front <strong>P</strong>.</p>
    <svg id="busSvg" viewBox="0 0 380 700" class="bus-svg" aria-label="Bus seat layout"></svg>
  </section>
  <aside class="seat-side">
    <h3>Legend</h3>
    <ul class="legend">
      <li><span class="sw a"></span> Available</li>
      <li><span class="sw s"></span> Selected</li>
      <li><span class="sw o"></span> Occupied</li>
      <li><span class="sw p"></span> Priority front</li>
    </ul>
    <h3>Selected</h3>
    <ul id="selSeats" class="sel-seats"><li>No seats selected</li></ul>
    <div class="price-box">
      <div><span>Trip base</span><strong id="base">$0</strong></div>
      <div><span>Seats</span><strong id="seatsCost">$0</strong></div>
      <div class="tot"><span>Subtotal</span><strong id="subtotal">$0</strong></div>
    </div>
    <button id="continueBtn" class="btn-primary big" disabled>Continue</button>
  </aside>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderSeats();</script>
</body>
</html>
