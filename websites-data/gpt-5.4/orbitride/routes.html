<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routes — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small">
  <a class="brand" href="index.html"><svg width="22" height="22" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#5B2C6F" stroke-width="2.4"/></svg><span>OrbitRide</span></a>
  <span id="searchPill" class="search-pill"></span>
</header>
<main class="results">
  <aside class="filters">
    <h3>Filters</h3>
    <label>Departure time
      <select id="timeFilter"><option value="any">Any time</option><option value="morning">Morning (5-12)</option><option value="afternoon">Afternoon (12-18)</option><option value="evening">Evening (18-24)</option></select>
    </label>
    <label>Max price <span id="priceLbl">$120</span>
      <input type="range" id="priceFilter" min="20" max="120" value="120" step="5"></label>
    <fieldset>
      <legend>Amenities</legend>
      <label><input type="checkbox" data-am="wifi" checked> Wi-Fi</label>
      <label><input type="checkbox" data-am="power"> Power outlet</label>
      <label><input type="checkbox" data-am="restroom"> Restroom</label>
      <label><input type="checkbox" data-am="express"> Express (≤1 stop)</label>
    </fieldset>
  </aside>
  <section>
    <div class="date-strip" id="dateStrip"></div>
    <div id="resultsSummary" class="results-summary" role="status" aria-live="polite"></div>
    <div id="resultsList" class="results-list"></div>
  </section>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderRoutes();</script>
</body>
</html>
