<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generators — PulseGrid</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">

<aside class="sidebar">
  <a href="index.html" class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3 12 H 7 L 9 5 L 12 19 L 14 9 L 16 14 H 21" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>PulseGrid</span>
  </a>
  <nav class="nav-main">
    <a href="index.html" class="nav-item"><span>▦</span>Overview</a>
    <a href="generators.html" class="nav-item active"><span>⚡</span>Generators</a>
    <a href="forecast.html" class="nav-item"><span>📈</span>Forecast</a>
    <a href="alarms.html" class="nav-item"><span>⚠</span>Alarms <span class="nav-badge">8</span></a>
    <span class="nav-item disabled" aria-disabled="true" title="Coming soon"><span>🌐</span>Topology <span class="soon-tag">soon</span></span>
    <span class="nav-item disabled" aria-disabled="true" title="Coming soon"><span>📜</span>Events <span class="soon-tag">soon</span></span>
  </nav>
</aside>

<main class="main">
  <header class="topbar">
    <div class="tb-left">
      <h2 class="page-title">Generators</h2>
      <span class="muted-sm" id="genCount">38 dispatchable units · 312 total assets</span>
    </div>
    <div class="tb-right">
      <label class="vis-hidden" for="genSearch">Search generators</label>
      <input type="search" id="genSearch" class="tb-search" placeholder="Search by name, plant, or EMS ID…" aria-label="Search generators by name, plant, or EMS ID" />
      <button class="tb-icon" id="themeToggle" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <section class="filter-strip" aria-label="Generator filters">
    <button class="fs active" data-status="all">All <span class="fs-count" id="cAll">312</span></button>
    <button class="fs" data-status="online">Online <span class="fs-count" id="cOnline">288</span></button>
    <button class="fs" data-status="ramping">Ramping <span class="fs-count" id="cRamp">14</span></button>
    <button class="fs" data-status="tripped">Tripped <span class="fs-count crit" id="cTrip">2</span></button>
    <button class="fs" data-status="maintenance">Maintenance <span class="fs-count" id="cMaint">8</span></button>
    <span class="fs-sep"></span>
    <label class="vis-hidden" for="fsFuel">Fuel type</label>
    <select id="fsFuel" aria-label="Filter by fuel type">
      <option value="">All fuels</option>
      <option value="natgas">Natural gas</option>
      <option value="hydro">Hydro</option>
      <option value="wind">Wind</option>
      <option value="solar">Solar</option>
      <option value="coal">Coal</option>
      <option value="nuclear">Nuclear</option>
      <option value="storage">Battery</option>
    </select>
    <label class="vis-hidden" for="fsZone">Zone</label>
    <select id="fsZone" aria-label="Filter by zone">
      <option value="">All zones</option>
      <option>NW</option><option>SW</option><option>RM</option><option>CA-N</option><option>CA-S</option><option>AZ</option><option>NV</option>
    </select>
  </section>

  <div class="results-summary" id="genSummary" aria-live="polite">Showing all 38 dispatchable units</div>

  <section class="gen-table-wrap">
    <table class="gen-table">
      <thead>
        <tr>
          <th><label class="vis-hidden" for="genSelectAll">Select all</label><input id="genSelectAll" type="checkbox" aria-label="Select all generators" /></th><th>Unit</th><th>Plant</th><th>Fuel</th><th>Zone</th>
          <th class="num">Output</th><th class="num">Capacity</th><th class="num">% cap</th>
          <th>Status</th><th>Operator</th><th></th>
        </tr>
      </thead>
      <tbody id="genTbody"><!-- JS --></tbody>
    </table>
    <div class="empty-state" id="genEmpty" hidden>
      <p><strong>No generators match the active filters.</strong></p>
      <p class="muted-sm" id="genEmptyDetail"></p>
      <button type="button" class="btn-primary" id="genReset">Reset filters</button>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
