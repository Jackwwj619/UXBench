<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - ChatGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <path d="M22.28 9.37a5.88 5.88 0 00-.51-4.85 5.96 5.96 0 00-6.42-2.86A5.9 5.9 0 0011 0a5.96 5.96 0 00-5.68 4.12 5.88 5.88 0 00-3.93 2.85 5.96 5.96 0 00.74 6.98 5.88 5.88 0 00.51 4.85 5.96 5.96 0 006.42 2.86A5.9 5.9 0 0013 24a5.96 5.96 0 005.68-4.12 5.88 5.88 0 003.93-2.85 5.96 5.96 0 00-.74-6.98" fill="#000"/>
                </svg>
            </div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Log in to your OpenAI account to continue</p>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" aria-describedby="emailHint" required>
                    <p id="emailHint" class="form-hint">Enter the email you used to sign up.</p>
                </div>
                <button type="submit" class="auth-btn">Continue</button>
            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <div class="social-logins">
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Continue with Apple
                </button>
                <button class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.35 11.1h-9.18v2.73h5.51c-.24 1.27-.98 2.34-2.08 3.06v2.54h3.37c1.97-1.81 3.1-4.48 3.1-7.63 0-.52-.05-1.03-.14-1.52-.18-.05-.38-.1-.58-.18z"/>
                        <path d="M4.93 4.93L3.52 6.34C1.95 7.91 1 10.04 1 12.5c0 2.46.95 4.59 2.52 6.16l1.41-1.41C3.73 16.05 3 14.37 3 12.5s.73-3.55 1.93-4.75z"/>
                    </svg>
                    Continue with Microsoft
                </button>
            </div>

            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        (function() {
            var form = document.getElementById('loginForm');
            if (!form) return;
            var emailInput = document.getElementById('email');
            var hint = document.getElementById('emailHint');

            function setError(msg) {
                hint.textContent = msg;
                hint.classList.add('form-hint-error');
                emailInput.classList.add('input-error');
                emailInput.setAttribute('aria-invalid', 'true');
            }
            function clearError() {
                hint.textContent = 'Enter the email you used to sign up.';
                hint.classList.remove('form-hint-error');
                emailInput.classList.remove('input-error');
                emailInput.removeAttribute('aria-invalid');
            }
            emailInput.addEventListener('input', clearError);
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var v = emailInput.value.trim();
                if (!v) {
                    setError('Please enter your email address to continue.');
                    emailInput.focus();
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
                    setError('That doesn\u2019t look like a valid email. Try again.');
                    emailInput.focus();
                    return;
                }
                var btn = form.querySelector('.auth-btn');
                btn.textContent = 'Signing in\u2026';
                btn.disabled = true;
            });
        })();
    </script>
</body>
</html>
