<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generators — PulseGrid</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">

<aside class="sidebar">
  <a href="index.html" class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M3 12 H 7 L 9 5 L 12 19 L 14 9 L 16 14 H 21" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>PulseGrid</span>
  </a>
  <nav class="nav-main">
    <a href="index.html" class="nav-item"><span>▦</span>Overview</a>
    <a href="generators.html" class="nav-item active"><span>⚡</span>Generators</a>
    <a href="forecast.html" class="nav-item"><span>📈</span>Forecast</a>
    <a href="alarms.html" class="nav-item"><span>⚠</span>Alarms <span class="nav-badge">8</span></a>
    <a href="#" class="nav-item disabled" aria-disabled="true" title="Topology view — coming soon"><span>🌐</span>Topology <span class="nav-soon">soon</span></a>
    <a href="#" class="nav-item disabled" aria-disabled="true" title="Events log — coming soon"><span>📜</span>Events <span class="nav-soon">soon</span></a>
  </nav>
</aside>

<main class="main">
  <header class="topbar">
    <div class="tb-left">
      <h2 class="page-title">Generators</h2>
      <span class="muted-sm" id="genCount">312 units</span>
    </div>
    <div class="tb-right">
      <label class="sr-only" for="genSearch">Search generators</label>
      <input type="search" id="genSearch" class="tb-search" placeholder="Search by name, plant, or EMS ID…" aria-label="Search generators by name, plant, or EMS ID" />
      <button class="tb-icon" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">☾</button>
    </div>
  </header>

  <section class="filter-strip" aria-label="Generator filters">
    <button class="fs active" data-status="all" aria-pressed="true">All <span class="fs-count" id="cAll">312</span></button>
    <button class="fs" data-status="online" aria-pressed="false">Online <span class="fs-count" id="cOnline">288</span></button>
    <button class="fs" data-status="ramping" aria-pressed="false">Ramping <span class="fs-count" id="cRamp">14</span></button>
    <button class="fs" data-status="tripped" aria-pressed="false">Tripped <span class="fs-count crit" id="cTrip">2</span></button>
    <button class="fs" data-status="maintenance" aria-pressed="false">Maintenance <span class="fs-count" id="cMaint">8</span></button>
    <span class="fs-sep"></span>
    <label class="field"><span class="field-label">Fuel</span>
      <select id="fsFuel" aria-label="Filter by fuel type">
        <option value="">All fuels</option>
        <option value="natgas">Natural gas</option>
        <option value="hydro">Hydro</option>
        <option value="wind">Wind</option>
        <option value="solar">Solar</option>
        <option value="coal">Coal</option>
        <option value="nuclear">Nuclear</option>
        <option value="storage">Battery</option>
      </select>
    </label>
    <label class="field"><span class="field-label">Zone</span>
      <select id="fsZone" aria-label="Filter by zone">
        <option value="">All zones</option>
        <option>NW</option><option>SW</option><option>RM</option><option>CA-N</option><option>CA-S</option><option>AZ</option><option>NV</option>
      </select>
    </label>
  </section>

  <section class="gen-table-wrap">
    <table class="gen-table">
      <thead>
        <tr>
          <th></th><th>Unit</th><th>Plant</th><th>Fuel</th><th>Zone</th>
          <th class="num">Output</th><th class="num">Capacity</th><th class="num">% cap</th>
          <th>Status</th><th>Operator</th><th></th>
        </tr>
      </thead>
      <tbody id="genTbody"><!-- JS --></tbody>
    </table>
    <p class="empty-state" id="genEmpty" hidden>No generators match the current filters.</p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<aside class="drawer" id="detailDrawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
  <header class="drawer-head">
    <h3 id="drawerTitle">Detail</h3>
    <button class="tb-icon" id="drawerClose" aria-label="Close detail">✕</button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="script.js"></script>
</body>
</html>
