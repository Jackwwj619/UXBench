<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonlightTickets — Tickets for tonight, not next week</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M22 5 A12 12 0 1 0 22 27 A9 9 0 1 1 22 5 Z" fill="#FFD23F"/></svg>
    <span>MoonlightTickets</span>
  </a>
  <nav><a href="#" class="current">Tonight</a><a href="#">This Week</a><a href="#">Calendar</a><a href="#">Venues</a><a href="#">Artists</a><a href="#">Sell tickets</a><a href="#">Sign in</a></nav>
</header>

<main class="discover">
  <section class="tonight">
    <h1>Tonight in your city</h1>
    <div class="tonight-grid" id="tonightGrid"></div>
  </section>

  <section class="filters-bar" aria-label="Filter events">
    <label>Date<select id="filterDate" aria-label="Filter by date"><option>Any date</option><option>This week</option><option>This weekend</option><option>Next 30 days</option></select></label>
    <label>Genre<select id="filterGenre" aria-label="Filter by genre"><option>All</option><option>Indie rock</option><option>Folk</option><option>Electronic</option><option>Jazz</option><option>Hip-hop</option><option>Experimental</option></select></label>
    <label>Venue<select id="filterVenue" aria-label="Filter by venue"><option>All</option><option>The Foundry</option><option>Halo Room</option><option>Velvet Pier</option><option>Coppergate Hall</option></select></label>
    <label>Price<select id="filterPrice" aria-label="Filter by price"><option>Any</option><option>Under $20</option><option>$20-40</option><option>$40-80</option><option>$80+</option></select></label>
  </section>
  <div class="filter-chips" id="filterChips" aria-live="polite"></div>

  <section class="events">
    <h2>This week</h2>
    <div class="event-grid" id="eventGrid"></div>
  </section>
</main>

<footer class="site-foot"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderDiscovery(); wireFilters();</script>
</body>
</html>
