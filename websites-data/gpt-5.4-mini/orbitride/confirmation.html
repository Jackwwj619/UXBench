<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a></header>
<main class="confirm-page">
  <h1>✓ Your trip is booked!</h1>
  <p>Booking reference <strong id="ref">OR-XXXXXX</strong>. Email confirmation on its way.</p>
  <div class="ticket">
    <svg class="qr" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" fill="#fff"/>
      <g fill="#1A1B2E">
        <rect x="10" y="10" width="22" height="22"/><rect x="14" y="14" width="14" height="14" fill="#fff"/><rect x="17" y="17" width="8" height="8"/>
        <rect x="68" y="10" width="22" height="22"/><rect x="72" y="14" width="14" height="14" fill="#fff"/><rect x="75" y="17" width="8" height="8"/>
        <rect x="10" y="68" width="22" height="22"/><rect x="14" y="72" width="14" height="14" fill="#fff"/><rect x="17" y="75" width="8" height="8"/>
        <rect x="40" y="10" width="6" height="6"/><rect x="50" y="14" width="6" height="6"/><rect x="58" y="22" width="6" height="6"/>
        <rect x="40" y="35" width="6" height="6"/><rect x="50" y="40" width="6" height="6"/><rect x="60" y="40" width="6" height="6"/>
        <rect x="40" y="55" width="6" height="6"/><rect x="55" y="60" width="6" height="6"/><rect x="65" y="65" width="6" height="6"/>
        <rect x="40" y="75" width="6" height="6"/><rect x="55" y="80" width="6" height="6"/>
      </g>
    </svg>
    <div id="ticketInfo"></div>
  </div>
  <div class="cta-row">
    <button class="btn-secondary" id="calBtn">Add to calendar</button>
    <button class="btn-secondary" id="emailBtn">Email me a copy</button>
    <button class="btn-primary" id="manageBtn">Manage trip</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderConfirmation();</script>
</body>
</html>
