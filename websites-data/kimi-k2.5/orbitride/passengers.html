<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a><span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span></span></header>

</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
