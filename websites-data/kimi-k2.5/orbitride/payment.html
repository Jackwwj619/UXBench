<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a><span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span></span></header>
<main class="extras">
  <section>
    <h1>Payment</h1>
    <div class="pay-methods">
      <label class="pm"><input type="radio" name="pm" value="card" checked> <span>Credit / debit card</span></label>
      <label class="pm"><input type="radio" name="pm" value="paypal"> <span>PayLite</span></label>
      <label class="pm"><input type="radio" name="pm" value="apple"> <span>Apple-Pay-like</span></label>
    </div>
    <div class="card-form" id="cardForm">
      <label for="cName">Cardholder name<input id="cName" name="cName" autocomplete="cc-name" aria-label="Cardholder name" required></label>
      <label for="cNum">Card number<input id="cNum" name="cNum" autocomplete="cc-number" aria-label="Card number" placeholder="4242 4242 4242 4242" inputmode="numeric"></label>
      <div class="g3">
        <label for="cExp">Expiry<input id="cExp" name="cExp" autocomplete="cc-exp" aria-label="Card expiry MM/YY" placeholder="MM/YY" inputmode="numeric"></label>
        <label for="cCvc">CVC<input id="cCvc" name="cCvc" autocomplete="cc-csc" aria-label="Card CVC" placeholder="123" inputmode="numeric"></label>
        <label for="cZip">Billing zip<input id="cZip" name="cZip" autocomplete="postal-code" aria-label="Billing zip code" placeholder="55555" inputmode="numeric"></label>
      </div>
      <label class="save" for="cSave"><input type="checkbox" id="cSave" name="cSave"> Save to my OrbitRide account</label>
      <p id="payErr" class="form-err" role="alert" aria-live="polite"></p>
    </div>
    <div class="promo">
      <label for="promo" class="sr-only">Promo code</label>
      <input id="promo" name="promo" aria-label="Promo code" placeholder="Promo code (e.g., STUDENT10)">
      <button id="applyPromo" type="button" aria-label="Apply promo code">Apply</button>
      <span id="promoMsg" role="status" aria-live="polite"></span>
    </div>
    <p class="legal"><a href="#">Refund policy</a> · <a href="#">Terms of service</a></p>
  </section>
  <aside class="summary-side">
    <h3>Your trip</h3>
    <ul id="sumLines"></ul>
    <div class="grand"><span>Total</span><strong id="grand">$0</strong></div>
    <button id="payBtn" type="button" class="btn-primary big" aria-label="Pay and confirm booking">Pay <span id="payAmount"></span></button>
  </aside>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderPayment();</script>
</body>
</html>
