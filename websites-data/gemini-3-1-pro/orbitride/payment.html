<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a><span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span></span></header>
<main class="extras">
  <form id="paymentForm" novalidate>
  <section>
    <h1>Payment</h1>
    <div class="pay-methods" role="radiogroup" aria-label="Payment method">
      <label class="pm"><input type="radio" name="pm" value="card" checked> <span>Credit / debit card</span></label>
      <label class="pm"><input type="radio" name="pm" value="paypal"> <span>PayLite</span></label>
      <label class="pm"><input type="radio" name="pm" value="apple"> <span>Apple-Pay-like</span></label>
    </div>
    <div class="card-form" id="cardForm">
      <label>Cardholder name<input id="cName" name="cName" required aria-required="true" aria-describedby="cNameErr"><span class="field-err" id="cNameErr"></span></label>
      <label>Card number<input id="cNum" name="cNum" required aria-required="true" placeholder="4242 4242 4242 4242" inputmode="numeric" aria-describedby="cNumErr"><span class="field-err" id="cNumErr"></span></label>
      <div class="g3">
        <label>Expiry<input id="cExp" name="cExp" required aria-required="true" placeholder="MM/YY" inputmode="numeric" aria-describedby="cExpErr"><span class="field-err" id="cExpErr"></span></label>
        <label>CVC<input id="cCvc" name="cCvc" required aria-required="true" placeholder="123" inputmode="numeric" aria-describedby="cCvcErr"><span class="field-err" id="cCvcErr"></span></label>
        <label>Billing zip<input id="cZip" name="cZip" required aria-required="true" placeholder="55555" inputmode="numeric" aria-describedby="cZipErr"><span class="field-err" id="cZipErr"></span></label>
      </div>
      <label class="save" for="cSave"><input type="checkbox" id="cSave" name="cSave"> <span>Save to my OrbitRide account</span></label>
    </div>
    <div class="alt-pay-note" id="altPayNote" hidden>You'll be redirected to complete payment after pressing Pay.</div>
    <div class="promo">
      <input id="promo" placeholder="Promo code (e.g., STUDENT10)">
      <button type="button" id="applyPromo">Apply</button>
      <span id="promoMsg"></span>
    </div>
    <p class="legal"><a href="#">Refund policy</a> · <a href="#">Terms of service</a></p>
  </section>
  <aside class="summary-side">
    <h3>Your trip</h3>
    <ul id="sumLines"></ul>
    <div class="grand"><span>Total</span><strong id="grand">$0</strong></div>
    <button id="payBtn" type="submit" class="btn-primary big">Pay <span id="payAmount"></span></button>
    <p class="form-summary-err" id="formErr" role="alert" aria-live="polite"></p>
  </aside>
  </form>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderPayment();</script>
</body>
</html>
