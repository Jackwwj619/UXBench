<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extras — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a><span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span></span></header>
<main class="extras">
  <section>
    <h1>Luggage &amp; extras</h1>
    <p class="hint">One small carry-on is free per passenger.</p>
    <div id="luggageBlock"></div>
    <h2>Add-ons</h2>
    <label class="addon-card"><input type="checkbox" data-ad="insurance"> <div><strong>Travel insurance</strong><span>Refund anytime, weather delays, $4.50/passenger</span></div></label>
    <label class="addon-card"><input type="checkbox" data-ad="priority"> <div><strong>Priority boarding</strong><span>Skip the line; board first, $3 once</span></div></label>
    <label class="addon-card"><input type="checkbox" data-ad="sms"> <div><strong>Tracking SMS</strong><span>Real-time location updates, $1.50 once</span></div></label>
  </section>
  <aside class="summary-side">
    <h3>Your trip</h3>
    <ul id="sumLines"></ul>
    <div class="grand"><span>Total</span><strong id="grand">$0</strong></div>
    <button id="continueBtn" class="btn-primary big">Continue to passengers</button>
  </aside>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderExtras();</script>
</body>
</html>
