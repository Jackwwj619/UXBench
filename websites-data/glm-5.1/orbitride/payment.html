<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — OrbitRide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar small"><a class="brand" href="index.html"><span>OrbitRide</span></a><span class="lock-timer"><span id="lockMin">10</span>:<span id="lockSec">00</span></span></header>
<main class="extras">
  <section>
    <h1>Payment</h1>
    <div class="pay-methods">
      <label class="pm"><input type="radio" name="pm" value="card" checked> <span>Credit / debit card</span></label>
      <label class="pm"><input type="radio" name="pm" value="paypal"> <span>PayLite</span></label>
      <label class="pm"><input type="radio" name="pm" value="apple"> <span>Apple-Pay-like</span></label>
    </div>
    <div class="card-form" id="cardForm">
      <label>Cardholder name<input id="cName" autocomplete="cc-name" aria-required="true"></label>
      <label>Card number<input id="cNum" placeholder="4242 4242 4242 4242" inputmode="numeric" autocomplete="cc-number" aria-required="true"></label>
      <div class="g3">
        <label>Expiry<input id="cExp" placeholder="MM/YY" inputmode="numeric" autocomplete="cc-exp" maxlength="5" aria-required="true"></label>
        <label>CVC<input id="cCvc" placeholder="123" inputmode="numeric" autocomplete="cc-csc" maxlength="4" aria-required="true"></label>
        <label>Billing zip<input id="cZip" placeholder="55555" inputmode="numeric" autocomplete="postal-code" maxlength="5" aria-required="true"></label>
      </div>
      <label class="save"><input type="checkbox" id="cSave"> Save to my OrbitRide account</label>
    </div>
    <div class="promo">
      <input id="promo" placeholder="Promo code (e.g., STUDENT10)">
      <button id="applyPromo">Apply</button>
      <span id="promoMsg"></span>
    </div>
    <p class="legal"><a href="#">Refund policy</a> · <a href="#">Terms of service</a></p>
  </section>
  <aside class="summary-side">
    <h3>Your trip</h3>
    <ul id="sumLines"></ul>
    <div class="grand"><span>Total</span><strong id="grand">$0</strong></div>
    <button id="payBtn" class="btn-primary big">Pay <span id="payAmount"></span></button>
  </aside>
</main>
<footer class="site-foot small"><p class="disclaimer">Local demo for UXBench. Fictional product, not a real company.</p></footer>
<script src="script.js"></script>
<script>renderPayment();</script>
</body>
</html>
