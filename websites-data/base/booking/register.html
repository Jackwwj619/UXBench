<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Booking.com</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Booking.com</a>
      <div class="header-actions">
        <button class="btn btn-outline">Help</button>
      </div>
    </div>
  </header>

  <div style="max-width:440px;margin:60px auto;padding:0 20px;">
    <div class="form-section">
      <h2 style="text-align:center;margin-bottom:24px;">Create your account</h2>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Email address</label>
        <input type="email" placeholder="Enter your email address" style="padding:12px;">
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Password</label>
        <input type="password" placeholder="Create a password (10+ characters)" style="padding:12px;">
        <div class="form-note">Use at least 10 characters, including a number and a symbol</div>
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Confirm password</label>
        <input type="password" placeholder="Confirm your password" style="padding:12px;">
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:16px;">Create account</button>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
        <span style="font-size:13px;color:#666;">or</span>
        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px;">
        <button style="padding:12px 16px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px;">
          <span style="font-size:20px;">G</span> Sign up with Google
        </button>
        <button style="padding:12px 16px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px;">
          <span style="font-size:20px;">f</span> Sign up with Facebook
        </button>
      </div>

      <div style="text-align:center;font-size:13px;">
        Already have an account? <a href="signin.html">Sign in</a>
      </div>

      <div style="text-align:center;font-size:12px;color:#666;line-height:1.6;margin-top:16px;">
        By creating an account, you agree with our
        <a href="#">Terms & Conditions</a> and <a href="#">Privacy Statement</a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
