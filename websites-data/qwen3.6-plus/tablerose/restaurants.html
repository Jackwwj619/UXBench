<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restaurants — Tablerose</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topnav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <path d="M16 5 C 21 8, 25 12, 24 18 C 23 23, 19 25, 16 23 C 13 25, 9 23, 8 18 C 7 12, 11 8, 16 5 Z" fill="#FBE4E4" stroke="#7C2D3F" stroke-width="1.6"/>
          <line x1="16" y1="23" x2="16" y2="28" stroke="#7C2D3F" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Tablerose</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="active">Discover</a>
      <a href="#">Cities</a>
      <a href="#">For restaurants</a>
      <a href="#">Help</a>
    </nav>
    <div class="nav-cta">
      <a href="#" class="link-muted">My reservations</a>
      <a href="#" class="btn btn-primary">Sign in</a>
    </div>
  </div>
</header>

<section class="rebar">
  <form id="reSearch" class="rebar-form">
    <span class="rb-summary">
      <strong id="rbWhere">Portland, OR</strong> · <span id="rbParty">2 guests</span> · <span id="rbDate">Sat, May 17</span> · <span id="rbTime">7:00 pm</span>
    </span>
    <button class="link-muted" type="button" id="rbEdit">Edit</button>
  </form>
</section>

<section class="restaurants-page">
  <aside class="filters">
    <h3>Filter</h3>

    <div class="filter-group">
      <h4>Cuisine</h4>
      <label><input type="checkbox" data-filter="cuisine" value="italian" /> Italian (12)</label>
      <label><input type="checkbox" data-filter="cuisine" value="japanese" /> Japanese (9)</label>
      <label><input type="checkbox" data-filter="cuisine" value="thai" /> Thai (5)</label>
      <label><input type="checkbox" data-filter="cuisine" value="sichuan" /> Sichuan (4)</label>
      <label><input type="checkbox" data-filter="cuisine" value="mediterranean" /> Mediterranean (8)</label>
      <label><input type="checkbox" data-filter="cuisine" value="newamerican" /> New American (14)</label>
      <label><input type="checkbox" data-filter="cuisine" value="vegan" /> Plant-based (6)</label>
      <label><input type="checkbox" data-filter="cuisine" value="bbq" /> BBQ &amp; smoke (3)</label>
    </div>

    <div class="filter-group">
      <h4>Price</h4>
      <div class="price-pills">
        <label><input type="checkbox" data-filter="price" value="1" /> $</label>
        <label><input type="checkbox" data-filter="price" value="2" /> $$</label>
        <label><input type="checkbox" data-filter="price" value="3" /> $$$</label>
        <label><input type="checkbox" data-filter="price" value="4" /> $$$$</label>
      </div>
    </div>

    <div class="filter-group">
      <h4>Neighborhood</h4>
      <label><input type="checkbox" data-filter="hood" value="pearl" /> Pearl District</label>
      <label><input type="checkbox" data-filter="hood" value="mississippi" /> Mississippi Ave</label>
      <label><input type="checkbox" data-filter="hood" value="alberta" /> Alberta Arts</label>
      <label><input type="checkbox" data-filter="hood" value="division" /> Division St</label>
      <label><input type="checkbox" data-filter="hood" value="hawthorne" /> Hawthorne</label>
      <label><input type="checkbox" data-filter="hood" value="downtown" /> Downtown</label>
    </div>

    <div class="filter-group">
      <h4>Features</h4>
      <label><input type="checkbox" data-filter="feat" value="outdoor" /> Outdoor seating</label>
      <label><input type="checkbox" data-filter="feat" value="bar" /> Counter / bar seats</label>
      <label><input type="checkbox" data-filter="feat" value="kid" /> Kid-friendly</label>
      <label><input type="checkbox" data-filter="feat" value="quiet" /> Quiet (under 65 dB)</label>
      <label><input type="checkbox" data-filter="feat" value="vegan" /> Vegan menu</label>
      <label><input type="checkbox" data-filter="feat" value="late" /> Open after 10 pm</label>
    </div>

    <button id="clearFilters" class="link-muted clear-btn">Reset filters</button>
  </aside>

  <main class="results">
    <div class="results-head">
      <span id="resultsCount">— restaurants</span>
      <select id="sortBy">
        <option value="relevance">Sort: Relevance</option>
        <option value="rating">Highest rated</option>
        <option value="price-asc">Price: low → high</option>
        <option value="price-desc">Price: high → low</option>
        <option value="distance">Nearest</option>
      </select>
    </div>
    <div id="resultsList" class="results-list"><!-- JS renders --></div>
    <div class="results-empty" id="resultsEmpty" hidden>
      <h3>Nothing matches those filters.</h3>
      <p>Try broadening the cuisine or price range, or pick a nearby time slot.</p>
    </div>
  </main>
</section>

<script src="script.js"></script>
</body>
</html>
