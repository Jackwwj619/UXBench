<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Booking.com</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Booking.com</a>
      <div class="header-actions">
        <button class="btn btn-outline">Help</button>
      </div>
    </div>
  </header>

  <div style="max-width:440px;margin:60px auto;padding:0 20px;">
    <div class="form-section">
      <h2 style="text-align:center;margin-bottom:24px;">Sign in or create an account</h2>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Email address</label>
        <input type="email" placeholder="Enter your email address" style="padding:12px;">
      </div>
      <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:16px;">Continue with email</button>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
        <span style="font-size:13px;color:#666;">or use one of these options</span>
        <div style="flex:1;height:1px;background:#e0e0e0;"></div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
        <button style="padding:12px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:24px;">G</button>
        <button style="padding:12px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:24px;">f</button>
        <button style="padding:12px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:24px;">&#63743;</button>
      </div>

      <div style="text-align:center;font-size:12px;color:#666;line-height:1.6;">
        By signing in or creating an account, you agree with our
        <a href="#">Terms & Conditions</a> and <a href="#">Privacy Statement</a>
      </div>
    </div>

    <div style="text-align:center;margin-top:24px;">
      <div style="font-size:12px;color:#666;margin-bottom:8px;">All rights reserved.</div>
      <div style="font-size:12px;color:#666;">Copyright (2006–2025) – Booking.com&trade;</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
