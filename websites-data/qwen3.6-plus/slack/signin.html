<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Slack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="nav-logo">
                    <svg width="80" height="20" viewBox="0 0 54 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4.6 14.2c0 1.3-1.1 2.3-2.3 2.3S0 15.5 0 14.2s1.1-2.3 2.3-2.3h2.3v2.3zm1.2 0c0-1.3 1.1-2.3 2.3-2.3s2.3 1.1 2.3 2.3v5.8c0 1.3-1.1 2.3-2.3 2.3s-2.3-1.1-2.3-2.3v-5.8z" fill="#E01E5A"/>
                        <path d="M8.1 4.6c-1.3 0-2.3-1.1-2.3-2.3S6.8 0 8.1 0s2.3 1.1 2.3 2.3v2.3H8.1zm0 1.2c1.3 0 2.3 1.1 2.3 2.3s-1.1 2.3-2.3 2.3H2.3C1.1 10.4 0 9.4 0 8.1s1.1-2.3 2.3-2.3h5.8z" fill="#36C5F0"/>
                        <path d="M17.8 8.1c0-1.3 1.1-2.3 2.3-2.3s2.3 1.1 2.3 2.3-1.1 2.3-2.3 2.3h-2.3V8.1zm-1.2 0c0 1.3-1.1 2.3-2.3 2.3s-2.3-1.1-2.3-2.3V2.3C12 1.1 13.1 0 14.3 0s2.3 1.1 2.3 2.3v5.8z" fill="#2EB67D"/>
                        <path d="M14.3 17.8c1.3 0 2.3 1.1 2.3 2.3s-1.1 2.3-2.3 2.3-2.3-1.1-2.3-2.3v-2.3h2.3zm0-1.2c-1.3 0-2.3-1.1-2.3-2.3s1.1-2.3 2.3-2.3h5.8c1.3 0 2.3 1.1 2.3 2.3s-1.1 2.3-2.3 2.3h-5.8z" fill="#ECB22E"/>
                    </svg>
                    <span class="nav-logo-text">slack</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <h1>Sign in to Slack</h1>
            <p class="auth-subtitle">We suggest using the email address you use at work.</p>

            <form class="auth-form" id="signinForm" novalidate>
                <div class="form-group">
                    <label for="signinEmail">Email address</label>
                    <input type="email" id="signinEmail" placeholder="name@company.com" required aria-describedby="signinEmailError">
                    <p class="field-error" id="signinEmailError" role="alert" aria-live="polite"></p>
                </div>
                <div class="form-group">
                    <label for="signinPassword">Password</label>
                    <input type="password" id="signinPassword" placeholder="Your password" required aria-describedby="signinPasswordError">
                    <p class="field-error" id="signinPasswordError" role="alert" aria-live="polite"></p>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>

            <div class="auth-divider"><span>OR</span></div>

            <button type="button" class="btn btn-social btn-block" id="ssoGoogle" data-provider="Google">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
                Sign in with Google
            </button>
            <button type="button" class="btn btn-social btn-block" id="ssoMicrosoft" data-provider="Microsoft">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 0C4.03 0 0 4.03 0 9c0 4.97 4.03 9 9 9s9-4.03 9-9c0-4.97-4.03-9-9-9zm0 1.5A7.5 7.5 0 0116.5 9 7.5 7.5 0 019 16.5 7.5 7.5 0 011.5 9 7.5 7.5 0 019 1.5z" fill="#0078D4"/><path d="M4 7h4v4H4z" fill="#0078D4"/><path d="M9 7h4v4H9z" fill="#0078D4"/><path d="M4 4h4v3H4z" fill="#0078D4"/><path d="M9 4h4v3H9z" fill="#0078D4"/></svg>
                Sign in with Microsoft
            </button>
            <p class="sso-status" id="ssoStatus" role="status" aria-live="polite"></p>

            <p class="auth-footer">New to Slack? <a href="get-started.html">Create an account</a></p>
            <p class="auth-footer"><a href="#" id="forgotLink">Forgot your password?</a></p>
        </div>
    </section>

    <div class="auth-success" id="signinSuccess" style="display:none">
        <div class="auth-card">
            <div class="success-icon">&#10003;</div>
            <h2>Welcome back!</h2>
            <p>Redirecting you to your workspace...</p>
            <a href="index.html" class="btn btn-primary">Go to Slack</a>
        </div>
    </div>

    <div class="auth-success" id="forgotSuccess" style="display:none">
        <div class="auth-card">
            <h2>Reset your password</h2>
            <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
            <form class="auth-form" id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="forgotEmail">Email address</label>
                    <input type="email" id="forgotEmail" placeholder="name@company.com" required aria-describedby="forgotEmailError">
                    <p class="field-error" id="forgotEmailError" role="alert" aria-live="polite"></p>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
            </form>
            <p class="auth-footer"><a href="signin.html">Back to sign in</a></p>
        </div>
    </div>

    <script>
    (function() {
        var form = document.getElementById('signinForm');
        var emailInput = document.getElementById('signinEmail');
        var passwordInput = document.getElementById('signinPassword');
        var emailError = document.getElementById('signinEmailError');
        var passwordError = document.getElementById('signinPasswordError');

        function clearErrors() {
            emailError.textContent = '';
            passwordError.textContent = '';
            emailInput.classList.remove('input-error');
            passwordInput.classList.remove('input-error');
        }

        function showError(input, errorEl, message) {
            errorEl.textContent = message;
            input.classList.add('input-error');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();
            var firstInvalid = null;

            if (!emailInput.value.trim()) {
                showError(emailInput, emailError, 'Email is required');
                firstInvalid = emailInput;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
                showError(emailInput, emailError, 'Please enter a valid email address');
                firstInvalid = emailInput;
            }

            if (!passwordInput.value.trim()) {
                showError(passwordInput, passwordError, 'Password is required');
                if (!firstInvalid) firstInvalid = passwordInput;
            }

            if (firstInvalid) {
                firstInvalid.focus();
                return;
            }

            document.querySelector('.auth-section').style.display = 'none';
            document.getElementById('signinSuccess').style.display = 'flex';
        });

        emailInput.addEventListener('input', function() {
            if (emailInput.value.trim()) {
                emailError.textContent = '';
                emailInput.classList.remove('input-error');
            }
        });
        passwordInput.addEventListener('input', function() {
            if (passwordInput.value.trim()) {
                passwordError.textContent = '';
                passwordInput.classList.remove('input-error');
            }
        });

        document.getElementById('forgotLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelector('.auth-section').style.display = 'none';
            document.getElementById('forgotSuccess').style.display = 'flex';
        });

        var ssoStatus = document.getElementById('ssoStatus');
        function handleSso(e) {
            var provider = e.currentTarget.getAttribute('data-provider') || 'SSO';
            ssoStatus.textContent = 'Connecting to ' + provider + '\u2026 (demo only \u2014 SSO is not enabled in this preview)';
            ssoStatus.classList.add('visible');
        }
        document.getElementById('ssoGoogle').addEventListener('click', handleSso);
        document.getElementById('ssoMicrosoft').addEventListener('click', handleSso);
        var forgotForm = document.getElementById('forgotForm');
        var forgotEmail = document.getElementById('forgotEmail');
        var forgotEmailError = document.getElementById('forgotEmailError');
        forgotForm.addEventListener('submit', function(e) {
            e.preventDefault();
            forgotEmailError.textContent = '';
            forgotEmail.classList.remove('input-error');
            if (!forgotEmail.value.trim()) {
                forgotEmailError.textContent = 'Email is required';
                forgotEmail.classList.add('input-error');
                forgotEmail.focus();
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotEmail.value)) {
                forgotEmailError.textContent = 'Please enter a valid email address';
                forgotEmail.classList.add('input-error');
                forgotEmail.focus();
                return;
            }
            document.getElementById('forgotSuccess').querySelector('h2').textContent = 'Check your email';
            document.getElementById('forgotSuccess').querySelector('p').textContent = 'We sent a password reset link to your email.';
            forgotForm.style.display = 'none';
        });
        forgotEmail.addEventListener('input', function() {
            if (forgotEmail.value.trim()) {
                forgotEmailError.textContent = '';
                forgotEmail.classList.remove('input-error');
            }
        });
    })();
    </script>
</body>
</html>
